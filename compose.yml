services:
  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      # hybrid: in-memory speed, flushed to disk every ~5s, so local S3 state survives container restarts.
      FLOCI_STORAGE_MODE: hybrid
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
      - floci-data:/app/data
    networks:
      - cdp-tenant

  ################################################################################

  mmo-cr-reference-data-service:
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
    links:
      - 'floci:floci'
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      AWS_ENDPOINT_URL: http://floci:4566
      S3_FORCE_PATH_STYLE: true
    networks:
      - cdp-tenant
    volumes:
      - ./src:/home/node/src
      - ./resources:/home/node/resources
      - ./package.json:/home/node/package.json
      - ./.env:/home/node/.env:ro

################################################################################

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant

volumes:
  floci-data:
